<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olá, Luan</title>
<style>
  :root {
    --bg: #fdfaf6;
    --red: #c0392b;
    --text: #2b2b2b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a18;
      --text: #f0ece6;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  h1 {
    color: var(--red);
    font-size: clamp(3.5rem, 15vw, 7rem);
    margin: 0;
    letter-spacing: 0.02em;
  }
  p.name {
    font-size: clamp(1.3rem, 5vw, 2rem);
    margin: 0.5rem 0 0;
  }
  p.welcome {
    font-size: 1.1rem;
    margin-top: 1.5rem;
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div>
    <h1>Olá</h1>
    <p class="name">Luan</p>
    <p class="welcome">Seja bem-vindo!</p>
  </div>
</body>
</html>
