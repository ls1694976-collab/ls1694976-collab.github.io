<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Uma surpresa para Jessica 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;background:radial-gradient(circle,#7046a8,#24113f);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;text-align:center;overflow-x:hidden}
main{width:100%;max-width:750px;padding:25px 15px}
h1{font-size:48px;margin:15px}
.sub{color:#e9d5ff}
.stage{position:relative;min-height:470px;margin-top:20px;padding-top:115px;display:flex;align-items:flex-end;justify-content:center}
.bubble{position:absolute;z-index:5;top:0;left:50%;transform:translateX(-50%);width:90%;min-height:95px;padding:22px;border-radius:25px;background:#fff;color:#54217d;font-size:19px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px #0004}
.bubble::after{content:"";position:absolute;bottom:-14px;left:50%;border-width:14px 14px 0;border-style:solid;border-color:#fff transparent transparent}
.character{position:relative;z-index:2;height:330px;max-width:85%;object-fit:contain;transform-origin:50% 90%;animation:idle 1.3s infinite cubic-bezier(.34,1.4,.64,1)}
button{border:none;border-radius:30px;padding:15px 25px;margin:7px;font-size:16px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#f5d0fe,#c4b5fd);color:#351454}
#restart{background:#ffffff22;color:#fff;border:1px solid #ffffff55}
.discreto{background:none;color:#e9d5ff;font-size:14px;font-weight:normal;opacity:.8;text-decoration:underline;padding:8px 12px}
.counter{color:#e9d5ff;margin-top:12px}
.heart{position:fixed;color:#d8b4fe;animation:float 7s linear infinite;pointer-events:none}

@keyframes idle{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-12px) scale(.97,1.04)}50%{transform:translateY(0) scale(1.05,.92)}75%{transform:translateY(-6px) scale(.99,1.02)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.15,.85)}50%{transform:translateY(-50px) scale(.92,1.1)}80%{transform:translateY(0) scale(1.12,.88)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(11deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(3deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.1,.9)}45%{transform:translateY(-42px) scale(.95,1.08)}70%{transform:translateY(0) scale(1.08,.92)}85%{transform:translateY(-8px) scale(1,1)}}
@keyframes tilt{0%,100%{transform:rotate(0) scale(1,1)}25%{transform:rotate(14deg) scale(1.03,.97)}50%{transform:rotate(-6deg) scale(1,1)}75%{transform:rotate(9deg) scale(.98,1.02)}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
@keyframes flip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(360deg) scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1,1)}20%{transform:scale(1.25,.8)}40%{transform:scale(.9,1.12)}60%{transform:scale(1.08,.94)}80%{transform:scale(.98,1.02)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-16px) rotate(-4deg)}35%{transform:translateX(14px) rotate(4deg)}55%{transform:translateX(-10px) rotate(-2deg)}75%{transform:translateX(6px) rotate(1deg)}}
@keyframes fim{0%,100%{transform:translateY(0) rotate(0) scale(1,1)}15%{transform:translateY(0) rotate(0) scale(1.1,.9)}40%{transform:translateY(-55px) rotate(-8deg) scale(.93,1.08)}60%{transform:translateY(0) rotate(6deg) scale(1.1,.9)}80%{transform:translateY(-18px) rotate(0) scale(1,1)}}
@keyframes float{0%{transform:translateY(0);opacity:0}20%{opacity:.7}100%{transform:translateY(-100vh);opacity:0}}
@keyframes appear{from{opacity:0;transform:translateX(-50%) scale(.8)}to{opacity:1;transform:translateX(-50%) scale(1)}}

/* ===== Cutscene ===== */
#cine{position:fixed;inset:0;z-index:100;background:#05010d;opacity:0;pointer-events:none;overflow:hidden}
#cine.on{pointer-events:auto;animation:cineIn 2.5s ease forwards}
#cine.off{animation:cineOut 2.5s ease forwards}
@keyframes cineIn{to{opacity:1}}
@keyframes cineOut{from{opacity:1}to{opacity:0}}
#cine canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cine::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,#000c 100%)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.abre{position:absolute;left:50%;top:50%;height:min(54vh,460px);max-width:88vw;z-index:4;opacity:0;pointer-events:none;filter:drop-shadow(0 0 28px #a855f7);transform:translate(-50%,-50%);animation:abre 5s ease forwards}
@keyframes abre{0%{opacity:0;transform:translate(-50%,-50%) scale(.92)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.barra{position:absolute;left:0;right:0;height:11vh;background:#000;z-index:5;transform:scaleY(0);transition:transform 1.8s ease}
.barra.t{top:0;transform-origin:top}
.barra.b{bottom:0;transform-origin:bottom}
#cine.on .barra{transform:scaleY(1)}
.nome{position:absolute;left:0;right:0;top:15vh;z-index:6;font-family:Cinzel,serif;font-weight:800;font-size:clamp(40px,12vw,104px);letter-spacing:.14em;color:#f3e8ff;pointer-events:none;text-shadow:0 1px 0 #c4b5fd,0 2px 0 #a78bfa,0 3px 0 #8b5cf6,0 4px 0 #6d28d9,0 5px 0 #4c1d95,0 0 24px #a855f7,0 0 60px #7e22ce}
.nome span{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(30px) rotateX(-80deg)}
.nome.on span{animation:letra 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes letra{to{opacity:1;filter:blur(0);transform:none}}
.msg{position:absolute;left:8vw;right:8vw;bottom:17vh;z-index:6;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(17px,4.2vw,24px);line-height:1.5;color:#f5eaff;min-height:6em;pointer-events:none;text-shadow:0 0 14px #7e22ce}
.msg.final{font-style:normal;font-family:Cinzel,serif;font-weight:800;font-size:clamp(20px,5vw,30px);color:#fff;animation:fadeIn 2.5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#cine .ctl{position:absolute;bottom:3vh;z-index:7;margin:0;padding:8px 14px;font-size:13px;background:#ffffff1f;color:#f3e8ff;border:1px solid #ffffff55;opacity:.7}
#musica{left:4vw}
.dir{right:4vw}

@media(max-width:480px){.stage{min-height:420px}.character{height:290px}h1{font-size:38px}}
</style>
</head>

function nextPhrase() {
    if (index >= phrases.length - 1) return;
    index++;
    bubble.textContent = phrases[index];
    bubble.style.animation = "none"; void bubble.offsetWidth; bubble.style.animation = "appear .4s ease";
    character.style.animation = "none"; void character.offsetWidth;
    character.style.animation = animations[(index - 1) % animations.length] + " 1s cubic-bezier(.34,1.4,.64,1)";
    counter.textContent = (index + 1) + " de " + phrases.length;
    if (index === phrases.length - 1) {
        proxima.style.display = "none";
        timerFinal = setTimeout(iniciarCutscene, 2200);
    }
}

function restart() {
    clearTimeout(timerFinal);
    pararCutscene();
    index = 0;
    bubble.textContent = phrases[0];
    character.style.animation = "none"; void character.offsetWidth; character.style.animation = IDLE;
    counter.textContent = "1 de " + phrases.length;
    proxima.style.display = ""; assistir.style.display = "none";
}

function finalizarPagina() {
    bubble.textContent = "Fim 💜";
    bubble.style.animation = "none"; void bubble.offsetWidth; bubble.style.animation = "appear .4s ease";

    character.style.animation = "fim 1.8s cubic-bezier(.34,1.4,.64,1) 2";
    assistir.style.display = "";
}

    cena.last = performance.now();
    cena.raf = requestAnimationFrame(loop);
}

function loop(now) {
    if (!cena) return;
    const dt = Math.min(.05, (now - cena.last) / 1000);
    cena.last = now;
    if (cena.tick(dt)) cena.raf = requestAnimationFrame(loop);
    else { destruir(); finalizarPagina(); }
}

function pularCutscene() { if (cena && cena.T < 40) cena.T = 40; }

function destruir() {
    if (!cena) return;
    cancelAnimationFrame(cena.raf);
    removeEventListener("resize", cena.resize);
    if (cena.r) { cena.r.dispose(); cena.r.forceContextLoss(); }
    cena = null;
    if (audio) { clearInterval(audio.timer); audio.A.close(); audio = null; }
    musicaOn = false;
    $("musica").textContent = "♪ Ativar música";
}

function pararCutscene() { if (cena) { destruir(); cine.className = ""; } }

function montarCena(cv) {
    const T3 = THREE;
    const r = new T3.WebGLRenderer({ canvas: cv, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    const sc = new T3.Scene(), cam = new T3.PerspectiveCamera(42, 1, .1, 200);
    const resize = () => { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
    resize(); addEventListener("resize", resize);
    cena.r = r; cena.resize = resize;

    const UT = { value: 0 };
    const pm = (col, size, op) => new T3.ShaderMaterial({
        uniforms: { uTime: UT, uSize: { value: size }, uOp: { value: op }, uColor: { value: new T3.Color(col) } },
        vertexShader: "attribute float aPh;uniform float uTime;uniform float uSize;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=uSize*(0.6+0.4*sin(uTime*2.0+aPh))*(260.0/-mv.z);gl_Position=projectionMatrix*mv;}",
        fragmentShader: "uniform vec3 uColor;uniform float uOp;void main(){float d=length(gl_PointCoord-0.5);gl_FragColor=vec4(uColor,smoothstep(0.5,0.0,d)*uOp);}",
        transparent: true, depthWrite: false, blending: T3.AdditiveBlending
    });
    const canvasTex = draw => { const c = document.createElement("canvas"); c.width = c.height = 128; draw(c.getContext("2d")); return new T3.CanvasTexture(c); };
    const glowTex = canvasTex(g => { const k = g.createRadialGradient(64, 64, 0, 64, 64, 64); k.addColorStop(0, "#fff"); k.addColorStop(.35, "rgba(255,255,255,.35)"); k.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = k; g.fillRect(0, 0, 128, 128); });
    const heartTex = canvasTex(g => { g.fillStyle = "#fff"; g.beginPath(); g.moveTo(64, 110); g.bezierCurveTo(10, 75, 14, 20, 64, 46); g.bezierCurveTo(114, 20, 118, 75, 64, 110); g.fill(); });
    const mkPts = (pos, ph, mat) => { const g = new T3.BufferGeometry(); g.setAttribute("position", new T3.Float32BufferAttribute(pos, 3)); g.setAttribute("aPh", new T3.Float32BufferAttribute(ph, 1)); return new T3.Points(g, mat); };
    const rnd = n => { const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = Math.random() * 6.283; return a; };

    // Estrelas
    const sp = new Float32Array(700 * 3);
    for (let i = 0; i < 700; i++) { const u = Math.random() * 2 - 1, th = Math.random() * 6.283, s = Math.sqrt(1 - u * u), R = 28 + Math.random() * 30; sp.set([R * s * Math.cos(th), R * u, R * s * Math.sin(th)], i * 3); }
    const stars = mkPts(sp, rnd(700), pm(0xf3e8ff, 3, .9)); sc.add(stars);

    // Partículas de poeira luminosa
    const dp = new Float32Array(420 * 3);
    for (let i = 0; i < 420; i++) dp.set([(Math.random() - .5) * 16, Math.random() * 10 - 1, (Math.random() - .5) * 12 - 2], i * 3);
    const dustMat = pm(0xc4b5fd, 2.4, 0), dust = mkPts(dp, rnd(420), dustMat); sc.add(dust);
    const dustArr = dust.geometry.attributes.position.array;

    // Coração de partículas
    const NH = 900, tg = new Float32Array(NH * 3), dr = new Float32Array(NH * 3);
    for (let i = 0; i < NH; i++) {
        const a = Math.random() * 6.283, x = 16 * Math.pow(Math.sin(a), 3), y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a), k = .085 * (.8 + .2 * Math.random());
        tg.set([x * k, y * k + 3, (Math.random() - .5) * .5], i * 3);
        const v = new T3.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(3 + Math.random() * 3);
        dr.set([v.x, v.y, v.z], i * 3);
    }
    const heartMat = pm(0xd8b4fe, 5, 0), heartPts = mkPts(new Float32Array(NH * 3), rnd(NH), heartMat);
    const hpa = heartPts.geometry.attributes.position.array;
    const halo = new T3.Sprite(new T3.SpriteMaterial({ map: glowTex, color: 0xa855f7, transparent: true, opacity: 0, depthWrite: false, blending: T3.AdditiveBlending }));
    halo.scale.set(9, 9, 1); halo.position.set(0, 3, -.3);
    const heartG = new T3.Group(); heartG.position.z = -1.2; heartG.add(heartPts, halo); sc.add(heartG);

    // Corações pequenos subindo
    const minis = [];
    for (let i = 0; i < 16; i++) {
        const s = new T3.Sprite(new T3.SpriteMaterial({ map: heartTex, color: 0xf0abfc, transparent: true, opacity: 0, depthWrite: false }));
        s.scale.set(.32, .32, 1); sc.add(s);
        minis.push({ s, x: (Math.random() - .5) * 7, z: -2 + Math.random() * 2, o: i * .5 });
    }

    // Pétalas (instanced)
    const NP = 70, petals = new T3.InstancedMesh(new T3.PlaneGeometry(.26, .26), new T3.MeshBasicMaterial({ map: glowTex, color: 0xf5d0fe, transparent: true, depthWrite: false, opacity: .8, side: T3.DoubleSide }), NP);
    const pz = []; for (let i = 0; i < NP; i++) pz.push([(Math.random() - .5) * 12, Math.random() * 8, Math.random() * 5]);
    sc.add(petals);
    const dm = new T3.Object3D();

    // Feixe de luz volumétrico
    const coneMat = new T3.ShaderMaterial({
        uniforms: { uI: { value: 0 }, uTime: UT },
        vertexShader: "varying float vY;void main(){vY=(position.y+4.5)/9.0;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
        fragmentShader: "uniform float uI;uniform float uTime;varying float vY;void main(){float a=pow(clamp(vY,0.0,1.0),1.6)*0.2*uI*(0.8+0.2*sin(uTime*1.5+vY*6.0));gl_FragColor=vec4(0.66,0.42,1.0,a);}",
        transparent: true, depthWrite: false, side: T3.DoubleSide, blending: T3.AdditiveBlending
    });
    const cone = new T3.Mesh(new T3.CylinderGeometry(.5, 2.6, 9, 40, 1, true), coneMat); cone.position.y = 4.5; sc.add(cone);

    // Plataforma, anel e sombra
    const plat = new T3.Mesh(new T3.CircleGeometry(1.9, 64).rotateX(-Math.PI / 2), new T3.MeshBasicMaterial({ map: glowTex, color: 0x7c3aed, transparent: true, opacity: .6, depthWrite: false }));
    sc.add(plat);
    const ring = new T3.Mesh(new T3.TorusGeometry(1.9, .018, 8, 160).rotateX(Math.PI / 2), new T3.MeshBasicMaterial({ color: 0xddd6fe, transparent: true, depthWrite: false, blending: T3.AdditiveBlending }));
    sc.add(ring);
    const sombra = new T3.Mesh(new T3.PlaneGeometry(2.4, 1.1).rotateX(-Math.PI / 2), new T3.MeshBasicMaterial({ map: glowTex, color: 0x12021f, transparent: true, opacity: .8, depthWrite: false }));
    sombra.position.y = .01; sc.add(sombra);

    // Boneco original (mesma imagem do site), com braços deformados em shader
    const W = 1.651, H = 2.6;
    const img = new Image(); img.src = character.src;
    const tx = new T3.Texture(img); img.onload = () => { tx.needsUpdate = true; };
    const VS = `uniform float uArmL;uniform float uArmR;uniform vec2 uPL;uniform vec2 uPR;varying vec2 vUv;
vec2 rot(vec2 v,float a){float c=cos(a),s=sin(a);return vec2(c*v.x-s*v.y,s*v.x+c*v.y);}
float band(vec2 p,vec2 a,vec2 b,out float s){vec2 ab=b-a;float h=clamp(dot(p-a,ab)/dot(ab,ab),0.0,1.0);s=h*length(ab);return length(p-a-ab*h);}
void main(){vUv=uv;vec2 p=position.xy;float sL,sR;
float dL=band(p,uPL,vec2(-0.588,-0.109),sL);float dR=band(p,uPR,vec2(0.693,-0.52),sR);
float wL=(1.0-smoothstep(0.12,0.22,dL))*smoothstep(0.08,0.3,sL);
float wR=(1.0-smoothstep(0.12,0.22,dR))*smoothstep(0.08,0.3,sR);
p=uPL+rot(p-uPL,uArmL*wL);p=uPR+rot(p-uPR,uArmR*wR);
gl_Position=projectionMatrix*modelViewMatrix*vec4(p,position.z,1.0);}`;
    const FS = `uniform sampler2D map;uniform float uRef;uniform float uAlpha;uniform vec3 uTint;varying vec2 vUv;
void main(){vec4 c=texture2D(map,vUv);if(c.a<0.05)discard;
float sh=0.8+0.3*(1.0-vUv.y);vec3 col=c.rgb*sh*mix(vec3(1.0),uTint,0.28);
float fd=uRef>0.5?1.0-0.85*vUv.y:1.0;
gl_FragColor=vec4(col,c.a*uAlpha*fd);}`;
    const mkMat = ref => new T3.ShaderMaterial({
        uniforms: { map: { value: tx }, uArmL: { value: 0 }, uArmR: { value: 0 }, uPL: { value: new T3.Vector2(-.089, .325) }, uPR: { value: new T3.Vector2(.236, .325) }, uRef: { value: ref }, uAlpha: { value: 0 }, uTint: { value: new T3.Color(0xe9d5ff) } },
        vertexShader: VS, fragmentShader: FS, transparent: true, depthWrite: false, side: T3.DoubleSide
    });
    const geo = new T3.PlaneGeometry(W, H, 96, 140);
    const figMat = mkMat(0), reflMat = mkMat(1);
    const fg = new T3.Group(); sc.add(fg);
    const fig = new T3.Mesh(geo, figMat); fig.position.y = H / 2 + .02; fg.add(fig);
    const rg = new T3.Group(); rg.scale.y = -1; fg.add(rg);
    const refl = new T3.Mesh(geo, reflMat); refl.position.y = H / 2 + .02; rg.add(refl);

    // Câmera e cores
    const bg0 = new T3.Color(0x07010f), bg1 = new T3.Color(0x2a1150), bgE = new T3.Color(0x020006), bgC = new T3.Color();
    sc.background = bgC;
    const ring0 = ring, nomeEl = $("nome"), msgEl = $("msg");
    let armL = 0, armR = 0, nomeOn = false, nN = -1, finalOn = false, saiu = false;

    cena.tick = dt => {
        const c = cena; c.T += dt; const T = c.T; UT.value = T;
        if (T >= 50.8) return false;
        if (!saiu && T >= 48) { saiu = true; cine.className = "off"; }

        // Cena 1-2: escurecer, ambiente roxo e fim
        const k1 = ease(clamp((T - 2) / 8)), kE = ease(clamp((T - 40) / 4)), fade = 1 - kE;
        bgC.copy(bg0).lerp(bg1, k1).lerp(bgE, kE);
        stars.rotation.y = T * .006;
        for (let i = 0; i < 420; i++) { const j = i * 3 + 1; dustArr[j] += dt * .18; if (dustArr[j] > 9) dustArr[j] = -1; }
        dust.geometry.attributes.position.needsUpdate = true;
        dustMat.uniforms.uOp.value = .8 * fade * clamp(T / 3);
        coneMat.uniforms.uI.value = clamp((T - 1) / 3) * fade * (T > 26 ? 1.4 : 1);

        // Câmera: aproximação, giro suave e órbita no clímax
        const k = ease(clamp((T - .5) / 12));
        let cx = 0, cy = 1.6 - .1 * k, cz = 9.5 - 3.1 * k;
        if (T > 26) {
            const a = (T - 26) * .12, rr = 6.4 - 1.2 * ease(clamp((T - 26) / 12));
            cx = Math.sin(a) * rr; cz = Math.cos(a) * rr; cy = 1.6 + .3 * Math.sin(T * .5);
        }
        cam.position.set(cx, cy, cz); cam.lookAt(0, 1.25, 0);

        // Boneco: sobe, acena, levanta os braços e balança de felicidade
        const cheer = T > 26 ? 1 : 0;
        const rise = easeBack(clamp((T - 3.5) / 2.2));
        fg.position.y = -1.8 * (1 - rise) + (cheer ? Math.abs(Math.sin(T * 4)) * .14 : 0);
        fg.rotation.y = cheer ? .35 * Math.sin(T * 1.2) : .08 * Math.sin(T * .8);
        const br = 1 + .01 * Math.sin(T * 2.2); fg.scale.set(br, br, br);
        let tL = 0, tR = 0;
        if (T > 6 && T < 10) tR = .95 + .25 * Math.sin(T * 9);
        if (cheer) { tL = -1.15 + .12 * Math.sin(T * 3.5); tR = 1.4 + .15 * Math.sin(T * 3.5 + 1); }
        armL += (tL - armL) * Math.min(1, dt * 5); armR += (tR - armR) * Math.min(1, dt * 5);
        const alpha = fade * clamp((T - 3) / 1.5);
        for (const m of [figMat, reflMat]) { m.uniforms.uArmL.value = armL; m.uniforms.uArmR.value = armR; }
        figMat.uniforms.uAlpha.value = alpha; reflMat.uniforms.uAlpha.value = .28 * alpha;

        // Clímax: coração de partículas se formando
        const hk = clamp((T - 26) / 3.4), hE = easeBack(hk);
        if (T >= 26 && hk < 1) {
            for (let i = 0; i < NH; i++) {
                const j = i * 3, b = Math.sin(hk * Math.PI) * (1 - hk * .6);
                hpa[j] = tg[j] * hE + dr[j] * b;
                hpa[j + 1] = 3 + (tg[j + 1] - 3) * hE + dr[j + 1] * b;
                hpa[j + 2] = tg[j + 2] * hE + dr[j + 2] * b;
            }
            heartPts.geometry.attributes.position.needsUpdate = true;
        }
        heartMat.uniforms.uOp.value = .9 * clamp((T - 26) / 1.2);
        heartG.scale.setScalar(T > 26 ? 1 + .05 * Math.sin(T * 2.4) : 1);
        halo.material.opacity = clamp((T - 26) / 2) * (.35 + .15 * Math.sin(T * 2.4));
        ring0.scale.setScalar(1 + .015 * Math.sin(T * 2));

        // Pétalas e corações flutuando
        petals.visible = fade > .02;
        for (let i = 0; i < NP; i++) {
            const p = pz[i];
            dm.position.set(p[0] + Math.sin(T * .7 + i) * .7, 7.5 - ((T * .5 + p[1]) % 8.5), p[2] - 3);
            dm.rotation.set(T * 1.1 + i, T * .8, i * .5);
            dm.updateMatrix(); petals.setMatrixAt(i, dm.matrix);
        }
        petals.instanceMatrix.needsUpdate = true;
        for (const m of minis) {
            m.s.position.set(m.x + Math.sin(T + m.o) * .4, -.5 + (((T - 26) * .6 + m.o) % 8 + 8) % 8, m.z);
            m.s.material.opacity = T > 26 ? .85 * fade : 0;
        }

        // Textos
        if (!nomeOn && T >= 10) { nomeOn = true; nomeEl.classList.add("on"); }
        const n = T < 14 ? 0 : Math.min(MSG_CH.length, Math.floor((T - 14) / .034));
        if (n !== nN) { nN = n; msgEl.textContent = MSG_CH.slice(0, n).join("") + (n > 0 && n < MSG_CH.length ? " ▍" : ""); }
        if (!finalOn && T >= 40) { finalOn = true; msgEl.className = "msg final"; msgEl.textContent = FINAL; }

        // Música: entra suave, cresce no clímax e some no fim
        if (audio) audio.master.gain.setTargetAtTime(musicaOn ? (T < 3 ? 0 : T < 26 ? .45 : T < 40 ? .9 : .9 * (1 - clamp((T - 40) / 6))) : 0, audio.A.currentTime, .4);

        r.render(sc, cam);
        return true;
    };
}

// ===== Música procedural (sem trecho de música protegida), iniciada só pelo usuário =====
function alternarMusica() {
    if (!audio) {
        const A = new (window.AudioContext || window.webkitAudioContext)();
        const master = A.createGain(); master.gain.value = 0; master.connect(A.destination);
        const rev = A.createConvolver(), buf = A.createBuffer(2, A.sampleRate * 2.5, A.sampleRate);
        for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); }
        rev.buffer = buf;
        const wet = A.createGain(); wet.gain.value = .35; rev.connect(wet); wet.connect(master);
        audio = { A, master, out: rev, t: A.currentTime + .2, n: 0 };
        audio.timer = setInterval(agendar, 250);
    }
    if (audio.A.state === "suspended") audio.A.resume();
    musicaOn = !musicaOn;
    $("musica").textContent = musicaOn ? "♪ Silenciar" : "♪ Ativar música";
}

function agendar() {
    const a = audio, now = a.A.currentTime;
    if (a.t < now) a.t = now + .1;
    while (a.t < now + 1.2) {
        if (a.n % 4 === 0) acorde(PROG[Math.floor(a.n / 4) % 4], a.t, 2.6);
        if (Math.random() < .8) sino(MEL[a.n % MEL.length], a.t + Math.random() * .04);
        a.n++; a.t += .6;
    }
}

function acorde(fs, w, d) {
    const a = audio;
    fs.forEach((f, i) => {
        const o = a.A.createOscillator(), g = a.A.createGain(), fl = a.A.createBiquadFilter();
        o.type = "sine"; o.frequency.value = f; o.detune.value = (i - 1.5) * 5;
        fl.type = "lowpass"; fl.frequency.value = 1200;
        g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.045, w + 1.2); g.gain.linearRampToValueAtTime(0, w + d);
        o.connect(fl); fl.connect(g); g.connect(a.master); g.connect(a.out);
        o.start(w); o.stop(w + d + .1);
    });
}

function sino(f, w) {
    const a = audio, o = a.A.createOscillator(), g = a.A.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, w); g.gain.exponentialRampToValueAtTime(.08, w + .02); g.gain.exponentialRampToValueAtTime(.0001, w + 1.4);
    o.connect(g); g.connect(a.master); g.connect(a.out);
    o.start(w); o.stop(w + 1.5);
}

// ===== Corações flutuando (original) =====
for (let i = 0; i < 15; i++) {
    const heart = document.createElement("span");
    heart.className = "heart";
    heart.textContent = "♥";
    heart.style.left = Math.random() * 100 + "%";
    heart.style.bottom = "-30px";
    heart.style.animationDelay = Math.random() * 7 + "s";
    document.body.appendChild(heart);
}
